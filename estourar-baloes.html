<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Estourar Balões</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #6EC6FF 0%, #A7E9FF 60%, #D8F6FF 100%);
    touch-action: manipulation;
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }
  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .cloud {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.85;
  }
  .balloon {
    position: absolute;
    width: 110px;
    height: 140px;
    cursor: pointer;
    animation: float linear;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
  }
  .balloon svg { width: 100%; height: 100%; display: block; }
  @keyframes float {
    from { transform: translateY(0) rotate(0deg); }
    to { transform: translateY(-115vh) rotate(8deg); }
  }
  .pop-particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: pop-out 0.6s ease-out forwards;
  }
  @keyframes pop-out {
    0% { transform: scale(1) translate(0,0); opacity: 1; }
    100% { transform: scale(0.2) translate(var(--dx), var(--dy)); opacity: 0; }
  }
  .praise-text {
    position: absolute;
    font-size: 60px;
    font-weight: 900;
    pointer-events: none;
    animation: praise-pop 1s ease-out forwards;
    text-shadow: 0 3px 0 rgba(0,0,0,0.15);
    white-space: nowrap;
  }
  @keyframes praise-pop {
    0% { transform: scale(0.3) translateY(0); opacity: 0; }
    30% { transform: scale(1.3) translateY(-10px); opacity: 1; }
    100% { transform: scale(1) translateY(-70px); opacity: 0; }
  }
  #replay {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: none;
    background: #FFD54F;
    font-size: 46px;
    box-shadow: 0 8px 0 #F5A623, 0 12px 16px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  #replay:active {
    box-shadow: 0 3px 0 #F5A623, 0 6px 10px rgba(0,0,0,0.2);
    transform: translateX(-50%) translateY(5px);
  }
</style>
</head>
<body>
<div id="game"></div>
<button id="replay" onclick="location.reload()">🔄</button>

<script>
const game = document.getElementById('game');
const colors = [
  { body: '#FF5C5C', shine: '#FFB3B3' },
  { body: '#FFD93D', shine: '#FFF3B0' },
  { body: '#FF7EC7', shine: '#FFC1E3' },
  { body: '#54D67B', shine: '#B7F5C6' },
  { body: '#9B6EFF', shine: '#D6C4FF' },
  { body: '#4FC3F7', shine: '#B3E5FC' },
  { body: '#FFA552', shine: '#FFD8AC' }
];

const praises = ["UAU!", "ISSO!", "MUITO BEM!", "PARABÉNS!", "ÊBAAA!", "OBA!", "SHOW!", "ARRASOU!"];

// Fundo com nuvens fofas
for (let i = 0; i < 5; i++) {
  const cloud = document.createElement('div');
  cloud.className = 'cloud';
  const size = 80 + Math.random() * 100;
  cloud.style.width = size + 'px';
  cloud.style.height = size * 0.6 + 'px';
  cloud.style.left = Math.random() * 90 + '%';
  cloud.style.top = Math.random() * 40 + '%';
  game.appendChild(cloud);
}

function balloonSVG(color) {
  return `<svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="50" rx="45" ry="50" fill="${color.body}"/>
    <ellipse cx="35" cy="30" rx="14" ry="18" fill="${color.shine}" opacity="0.7"/>
    <polygon points="45,98 55,98 50,110" fill="${color.body}"/>
    <line x1="50" y1="110" x2="50" y2="130" stroke="#999" stroke-width="2"/>
  </svg>`;
}

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-BR';
    u.pitch = 1.4;
    u.rate = 1.0;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function spawnBalloon() {
  const balloon = document.createElement('div');
  balloon.className = 'balloon';
  const color = colors[Math.floor(Math.random() * colors.length)];
  balloon.innerHTML = balloonSVG(color);

  const startX = Math.random() * (window.innerWidth - 130) + 10;
  const duration = 7 + Math.random() * 5;
  balloon.style.left = startX + 'px';
  balloon.style.top = window.innerHeight + 'px';
  balloon.style.animationDuration = duration + 's';

  const pop = (e) => {
    e.preventDefault();
    popBalloon(balloon, color);
  };
  balloon.addEventListener('pointerdown', pop, { once: true });

  balloon.addEventListener('animationend', () => {
    if (balloon.parentNode) balloon.remove();
  });

  game.appendChild(balloon);
}

function popBalloon(balloon, color) {
  const rect = balloon.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  balloon.remove();

  // Partículas de brilho
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'pop-particle';
    const size = 8 + Math.random() * 14;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = Math.random() > 0.5 ? color.body : color.shine;
    p.style.left = (cx - size / 2) + 'px';
    p.style.top = (cy - size / 2) + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 80;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    game.appendChild(p);
    setTimeout(() => p.remove(), 650);
  }

  // Texto de elogio
  const praise = document.createElement('div');
  praise.className = 'praise-text';
  const text = praises[Math.floor(Math.random() * praises.length)];
  praise.textContent = text;
  praise.style.left = (cx - 100) + 'px';
  praise.style.top = (cy - 30) + 'px';
  praise.style.color = color.body;
  game.appendChild(praise);
  setTimeout(() => praise.remove(), 1000);

  speak(text);

  // som simples de "pop" via Web Audio
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.start(); osc.stop(ctx.currentTime + 0.2);
  } catch (e) {}

  // sempre nasce outro balão no lugar
  setTimeout(spawnBalloon, 300 + Math.random() * 400);
}

// Começa com vários balões e mantém sempre balões na tela
for (let i = 0; i < 6; i++) {
  setTimeout(spawnBalloon, i * 900);
}
setInterval(() => {
  if (document.querySelectorAll('.balloon').length < 6) spawnBalloon();
}, 2000);
</script>
</body>
</html>
