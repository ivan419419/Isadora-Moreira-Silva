<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fazendinha da Isadora</title>
<style>
  :root{
    --sky-top:#cdeaffb3;
    --sky-a:#eae4ff;
    --sky-b:#cff3ff;
    --coral:#ff8fa3;
    --coral-dark:#e56b82;
    --sun:#ffd166;
    --sun-dark:#e8ac2e;
    --leaf:#8fe3b0;
    --leaf-dark:#5fc98a;
    --ink:#3a3358;
    --card:#ffffff;
    --slot:#efe9ff;
    --slot-border:#d9cdfa;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system, "Segoe UI Rounded", "Segoe UI", Verdana, sans-serif;
    background:linear-gradient(160deg, var(--sky-a), var(--sky-b) 60%, #fff7e6 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }
  .topbar{
    width:100%; max-width:480px;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 6px;
  }
  .coins{
    display:flex; align-items:center; gap:8px;
    background:var(--card);
    border-radius:999px;
    padding:8px 16px 8px 8px;
    box-shadow:0 4px 0 rgba(58,51,88,0.12);
    font-weight:800; font-size:1.15rem;
  }
  .coin-icon{
    width:28px;height:28px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff3c9, var(--sun) 60%, var(--sun-dark));
    display:flex;align-items:center;justify-content:center;
    font-size:1rem; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12);
  }
  .icon-btn{
    width:44px;height:44px;border-radius:14px;
    background:var(--card); border:none;
    box-shadow:0 4px 0 rgba(58,51,88,0.12);
    font-size:1.3rem; display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(58,51,88,0.12);}

  h1{
    font-size:1.4rem; margin:2px 0 10px; text-align:center;
    letter-spacing:0.5px;
  }
  h1 .sparkle{opacity:0.8;}

  .board-wrap{
    width:100%; max-width:480px; padding:0 14px;
  }
  .hint{
    text-align:center; font-size:0.85rem; min-height:1.4em;
    color:#6b5f92; margin-bottom:6px; font-weight:600;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
  }
  .row-label{
    grid-column:1/-1;
    font-size:0.7rem; text-transform:uppercase; letter-spacing:1px;
    color:#8a7fb0; font-weight:800; margin:6px 0 -2px;
  }
  .slot{
    aspect-ratio:1/1;
    border-radius:18px;
    background:var(--slot);
    border:2px dashed var(--slot-border);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    font-size:2rem;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .slot.filled{
    border-style:solid;
    background:var(--card);
    box-shadow:0 4px 0 rgba(58,51,88,0.10);
  }
  .slot.selected{
    transform:scale(1.06);
    box-shadow:0 0 0 3px var(--coral), 0 4px 0 rgba(58,51,88,0.10);
  }
  .nest{
    background:linear-gradient(180deg, var(--sun) 0%, var(--sun-dark) 100%);
    border:none;
    flex-direction:column;
    gap:2px;
    cursor:pointer;
  }
  .nest .bar-bg{
    width:70%; height:7px; border-radius:5px;
    background:rgba(255,255,255,0.55);
    overflow:hidden; margin-top:4px;
  }
  .nest .bar-fill{
    height:100%; background:var(--leaf-dark); width:0%;
    transition:width .2s linear;
  }
  .nest.ready{
    animation:pulse 0.9s infinite;
    cursor:pointer;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }
  .nest-emoji{font-size:1.6rem;}
  .nest-time{font-size:0.6rem; font-weight:700; color:#5a4a12;}

  .creature{
    cursor:pointer;
    animation:pop .25s ease;
  }
  @keyframes pop{
    from{transform:scale(0.4); opacity:0;}
    to{transform:scale(1); opacity:1;}
  }
  .egg-progress{
    position:absolute; bottom:4px; left:8%; width:84%; height:5px;
    border-radius:4px; background:rgba(58,51,88,0.12); overflow:hidden;
  }
  .egg-progress-fill{
    height:100%; background:var(--coral); width:0%;
  }

  .bottom-bar{
    width:100%; max-width:480px; padding:16px 14px 26px;
    margin-top:auto;
    display:flex; gap:10px;
  }
  .action{
    flex:1; border:none; border-radius:16px; padding:10px 8px 12px;
    background:var(--leaf);
    box-shadow:0 4px 0 var(--leaf-dark);
    font-weight:800; color:#1e4d33;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    cursor:pointer;
  }
  .action:active{transform:translateY(3px); box-shadow:0 1px 0 var(--leaf-dark);}
  .action.secondary{
    background:#ffe3ea; box-shadow:0 4px 0 var(--coral-dark); color:#7a2436;
  }
  .action .a-title{font-size:0.95rem;}
  .action .a-sub{font-size:0.7rem; opacity:0.85; font-weight:700;}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px;
    font-weight:700; font-size:0.9rem; box-shadow:0 6px 14px rgba(0,0,0,0.2);
    transition:transform .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  .float-coin{
    position:fixed; font-weight:800; color:var(--sun-dark); font-size:1rem;
    pointer-events:none; z-index:60; animation:floatup 0.9s ease forwards;
  }
  @keyframes floatup{
    from{opacity:1; transform:translateY(0);}
    to{opacity:0; transform:translateY(-40px);}
  }

  .pop-particle{
    position:fixed; border-radius:50%; pointer-events:none; z-index:59;
    animation:pop-out 0.6s ease-out forwards;
  }
  @keyframes pop-out{
    0%{transform:scale(1) translate(0,0); opacity:1;}
    100%{transform:scale(0.2) translate(var(--dx), var(--dy)); opacity:0;}
  }
  .praise-text{
    position:fixed; font-size:2.2rem; font-weight:900; pointer-events:none; z-index:61;
    animation:praise-pop 1s ease-out forwards;
    text-shadow:0 3px 0 rgba(0,0,0,0.15); white-space:nowrap;
  }
  @keyframes praise-pop{
    0%{transform:scale(0.3) translateY(0); opacity:0;}
    30%{transform:scale(1.25) translateY(-10px); opacity:1;}
    100%{transform:scale(1) translateY(-60px); opacity:0;}
  }

  .modal-bg{
    position:fixed; inset:0; background:rgba(58,51,88,0.45);
    display:none; align-items:center; justify-content:center; z-index:100;
    padding:20px;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:#fff; border-radius:20px; padding:22px; max-width:320px; width:100%;
    text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2);
  }
  .modal h2{margin-top:0; font-size:1.1rem;}
  .modal p{font-size:0.9rem; color:#5a4f78;}
  .modal-btns{display:flex; gap:10px; margin-top:14px;}
  .modal-btns button{
    flex:1; padding:10px; border-radius:12px; border:none; font-weight:800; cursor:pointer;
  }
  .btn-yes{background:var(--coral); color:#fff;}
  .btn-no{background:#eee; color:#555;}

  footer{
    font-size:0.65rem; color:#9c92bd; padding-bottom:10px; text-align:center;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="coins"><span class="coin-icon">🌟</span><span id="coinCount">0</span></div>
  <button class="icon-btn" id="settingsBtn" aria-label="Configurações">⚙️</button>
</div>

<h1>🐣 Fazendinha da Isadora <span class="sparkle">✨</span></h1>

<div class="board-wrap">
  <div class="hint" id="hint">Toque num ninho quando ele brilhar!</div>
  <div class="grid" id="grid"></div>
</div>

<div class="bottom-bar">
  <button class="action secondary" id="sellBtn">
    <span class="a-title">💰 Vender</span>
    <span class="a-sub">bichinho selecionado</span>
  </button>
  <button class="action" id="boostBtn">
    <span class="a-title">⚡ Turbo</span>
    <span class="a-sub" id="boostSub">grátis a cada minuto</span>
  </button>
</div>

<footer>Feito com carinho para a Isadora 💜 — funciona sem internet</footer>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="resetModal">
  <div class="modal">
    <h2>Recomeçar o jogo?</h2>
    <p>Isso vai apagar seu progresso e suas moedas ⭐.</p>
    <div class="modal-btns">
      <button class="btn-no" id="cancelReset">Cancelar</button>
      <button class="btn-yes" id="confirmReset">Recomeçar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- config ----------
  var COLS = 4, ROWS = 4; // play field rows (below the nests)
  var NEST_TIME = 12000;     // ms to produce an egg
  var HATCH_TIME = 9000;     // ms for an egg to hatch
  var TIERS = [
    {emoji:"🐣", name:"Pintinho"},
    {emoji:"🐥", name:"Franguinho"},
    {emoji:"🐔", name:"Galinha"},
    {emoji:"🦚", name:"Pavãozinho"},
    {emoji:"🦄", name:"Unicórnio"},
    {emoji:"🌈", name:"Lendário"}
  ];
  var SAVE_KEY = "isadora-fazendinha-save-v1";
  var PRAISES = ["UAU!", "ISSO!", "MUITO BEM!", "PARABÉNS!", "ÊBAAA!", "OBA!", "SHOW!", "ARRASOU!"];
  var PRAISE_COLORS = ["#FF5C5C","#FFD93D","#FF7EC7","#54D67B","#9B6EFF","#4FC3F7","#FFA552"];

  function speak(text){
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "pt-BR";
      u.pitch = 1.4;
      u.rate = 1.0;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  function playPop(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    }catch(e){}
  }

  function celebrate(x, y){
    var color = PRAISE_COLORS[Math.floor(Math.random()*PRAISE_COLORS.length)];
    for (var i=0;i<12;i++){
      var p = document.createElement("div");
      p.className = "pop-particle";
      var size = 8 + Math.random()*14;
      p.style.width = size+"px";
      p.style.height = size+"px";
      p.style.background = color;
      p.style.left = (x - size/2)+"px";
      p.style.top = (y - size/2)+"px";
      var angle = Math.random()*Math.PI*2;
      var dist = 50 + Math.random()*70;
      p.style.setProperty("--dx", Math.cos(angle)*dist+"px");
      p.style.setProperty("--dy", Math.sin(angle)*dist+"px");
      document.body.appendChild(p);
      (function(el){ setTimeout(function(){ el.remove(); }, 650); })(p);
    }
    var text = PRAISES[Math.floor(Math.random()*PRAISES.length)];
    var praise = document.createElement("div");
    praise.className = "praise-text";
    praise.textContent = text;
    praise.style.left = (x - 70)+"px";
    praise.style.top = (y - 20)+"px";
    praise.style.color = color;
    document.body.appendChild(praise);
    setTimeout(function(){ praise.remove(); }, 1000);
    playPop();
    speak(text);
  }

  // ---------- state ----------
  var state = null;
  var selected = null; // {r,c}
  var boostUntil = 0;
  var boostReadyAt = 0;

  function freshState(){
    var nests = [];
    for (var i=0;i<4;i++){ nests.push({progress:0, ready:false}); }
    var field = [];
    for (var r=0;r<ROWS;r++){
      var row = [];
      for (var c=0;c<COLS;c++) row.push(null);
      field.push(row);
    }
    return { coins: 0, nests: nests, field: field, savedAt: Date.now() };
  }

  function load(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return freshState();
      var s = JSON.parse(raw);
      // catch up offline nest progress a little (cap it so it's not exploitable/overwhelming)
      var elapsed = Math.min(Date.now() - (s.savedAt||Date.now()), 5*60*1000);
      s.nests.forEach(function(n){
        if (!n.ready){
          n.progress = Math.min(NEST_TIME, n.progress + elapsed);
          if (n.progress >= NEST_TIME) n.ready = true;
        }
      });
      s.field.forEach(function(row){
        row.forEach(function(cell){
          if (cell && cell.type === "egg" && !cell.hatched){
            cell.progress = Math.min(HATCH_TIME, cell.progress + elapsed);
          }
        });
      });
      return s;
    }catch(e){ return freshState(); }
  }

  function save(){
    state.savedAt = Date.now();
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
  }

  // ---------- ui helpers ----------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1600);
  }

  function floatCoin(x, y, amount){
    var el = document.createElement("div");
    el.className = "float-coin";
    el.textContent = "+" + amount + " 🌟";
    el.style.left = x + "px";
    el.style.top = y + "px";
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 900);
  }

  function setHint(msg){ document.getElementById("hint").textContent = msg; }

  // ---------- rendering ----------
  var gridEl = document.getElementById("grid");
  var coinEl = document.getElementById("coinCount");

  function render(){
    coinEl.textContent = state.coins;
    gridEl.innerHTML = "";

    var nestLabel = document.createElement("div");
    nestLabel.className = "row-label";
    nestLabel.textContent = "Ninhos";
    gridEl.appendChild(nestLabel);

    state.nests.forEach(function(n, i){
      var el = document.createElement("div");
      el.className = "slot nest" + (n.ready ? " ready" : "");
      var pct = Math.min(100, Math.round((n.progress / NEST_TIME) * 100));
      el.innerHTML =
        '<div class="nest-emoji">' + (n.ready ? "🥚" : "🪺") + '</div>' +
        (n.ready
          ? '<div class="nest-time">toque!</div>'
          : '<div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%"></div></div>');
      el.addEventListener("click", function(){ onNestTap(i); });
      gridEl.appendChild(el);
    });

    var fieldLabel = document.createElement("div");
    fieldLabel.className = "row-label";
    fieldLabel.textContent = "Fazenda — toque para escolher, toque de novo para juntar";
    gridEl.appendChild(fieldLabel);

    for (var r=0;r<ROWS;r++){
      for (var c=0;c<COLS;c++){
        var cell = state.field[r][c];
        var slot = document.createElement("div");
        slot.className = "slot" + (cell ? " filled" : "");
        if (selected && selected.r===r && selected.c===c) slot.classList.add("selected");

        if (cell){
          if (cell.type === "egg"){
            var pct2 = Math.min(100, Math.round((cell.progress / HATCH_TIME) * 100));
            slot.innerHTML = '<div class="creature">🥚</div>' +
              '<div class="egg-progress"><div class="egg-progress-fill" style="width:'+pct2+'%"></div></div>';
          } else {
            var tierInfo = TIERS[cell.tier];
            slot.innerHTML = '<div class="creature">' + tierInfo.emoji + '</div>';
          }
        }
        (function(rr,cc){
          slot.addEventListener("click", function(){ onCellTap(rr,cc); });
        })(r,c);
        gridEl.appendChild(slot);
      }
    }
  }

  // ---------- game actions ----------
  function findEmptyCell(){
    for (var r=0;r<ROWS;r++){
      for (var c=0;c<COLS;c++){
        if (!state.field[r][c]) return {r:r,c:c};
      }
    }
    return null;
  }

  function onNestTap(i){
    var n = state.nests[i];
    if (!n.ready) return;
    var spot = findEmptyCell();
    if (!spot){
      toast("A fazenda está cheia! Junte alguns bichinhos primeiro 🐤");
      return;
    }
    state.field[spot.r][spot.c] = {type:"egg", progress:0};
    n.ready = false;
    n.progress = 0;
    playPop();
    save();
    render();
  }

  function onCellTap(r,c){
    var cell = state.field[r][c];

    if (!selected){
      if (cell && cell.type === "creature"){
        selected = {r:r,c:c};
        setHint("Agora toque em outro bichinho igual para juntar ✨");
        render();
      } else if (cell && cell.type === "egg"){
        toast("Esse ovo ainda está chocando 🥚");
      }
      return;
    }

    // something already selected
    if (selected.r === r && selected.c === c){
      selected = null;
      setHint("Toque num ninho quando ele brilhar!");
      render();
      return;
    }

    var a = state.field[selected.r][selected.c];
    var b = cell;

    if (!b){
      // move creature to empty slot
      state.field[r][c] = a;
      state.field[selected.r][selected.c] = null;
      selected = null;
      setHint("Toque num ninho quando ele brilhar!");
      save(); render();
      return;
    }

    if (b.type === "creature" && a.type === "creature" && a.tier === b.tier){
      var newTier = a.tier + 1;
      if (newTier >= TIERS.length){
        toast("Esse já é o bichinho mais especial! Venda-o por moedas 🌈");
        selected = null;
        render();
        return;
      }
      state.field[r][c] = {type:"creature", tier:newTier};
      state.field[selected.r][selected.c] = null;
      var reward = 5 * Math.pow(2, newTier);
      state.coins += reward;
      var cellRect = gridEl.getBoundingClientRect();
      var cellW = cellRect.width / COLS;
      var cx = cellRect.left + cellW * (c + 0.5);
      var cy = cellRect.top + (cellRect.height / (ROWS + 2)) * (r + 2.5);
      floatCoin(cx, cy - 20, reward);
      celebrate(cx, cy);
      selected = null;
      save(); render();
      return;
    }

    // tapped a different, non-matching creature: switch selection
    if (b.type === "creature"){
      selected = {r:r,c:c};
      setHint("Agora toque em outro bichinho igual para juntar ✨");
      render();
      return;
    }

    toast("Esse ovo ainda está chocando 🥚");
  }

  document.getElementById("sellBtn").addEventListener("click", function(){
    if (!selected){
      toast("Escolha um bichinho primeiro 🐤");
      return;
    }
    var cell = state.field[selected.r][selected.c];
    if (!cell || cell.type !== "creature"){
      toast("Escolha um bichinho (não um ovo) 🥚");
      return;
    }
    var value = 8 * Math.pow(2, cell.tier);
    state.coins += value;
    state.field[selected.r][selected.c] = null;
    var rect = gridEl.getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    floatCoin(cx, cy - 20, value);
    celebrate(cx, cy);
    selected = null;
    save(); render();
  });

  var boostBtn = document.getElementById("boostBtn");
  var boostSub = document.getElementById("boostSub");
  boostBtn.addEventListener("click", function(){
    var now = Date.now();
    if (now < boostReadyAt){
      toast("O turbo ainda está descansando 😴");
      return;
    }
    boostUntil = now + 20000; // 20s of fast production
    boostReadyAt = now + 60000; // usable again in 60s
    toast("⚡ Turbo ativado! Tudo mais rápido por 20s");
  });

  // ---------- settings / reset ----------
  var resetModal = document.getElementById("resetModal");
  document.getElementById("settingsBtn").addEventListener("click", function(){
    resetModal.classList.add("show");
  });
  document.getElementById("cancelReset").addEventListener("click", function(){
    resetModal.classList.remove("show");
  });
  document.getElementById("confirmReset").addEventListener("click", function(){
    state = freshState();
    selected = null;
    save();
    render();
    resetModal.classList.remove("show");
    toast("Jogo reiniciado!");
  });

  // ---------- game loop ----------
  function tick(dt){
    var now = Date.now();
    var speedMult = (now < boostUntil) ? 4 : 1;
    var effectiveDt = dt * speedMult;

    var changed = false;
    state.nests.forEach(function(n){
      if (!n.ready){
        n.progress += effectiveDt;
        if (n.progress >= NEST_TIME){
          n.progress = NEST_TIME;
          n.ready = true;
        }
        changed = true;
      }
    });
    state.field.forEach(function(row){
      row.forEach(function(cell){
        if (cell && cell.type === "egg"){
          cell.progress += effectiveDt;
          if (cell.progress >= HATCH_TIME){
            cell.type = "creature";
            cell.tier = 0;
          }
          changed = true;
        }
      });
    });

    if (now < boostReadyAt){
      var secsLeft = Math.ceil((boostReadyAt - now)/1000);
      boostSub.textContent = (now < boostUntil) ? "ativo!" : (secsLeft + "s para recarregar");
    } else {
      boostSub.textContent = "grátis a cada minuto";
    }

    if (changed) render();
  }

  var last = Date.now();
  function loop(){
    var now = Date.now();
    var dt = now - last;
    last = now;
    tick(dt);
    requestAnimationFrame(loop);
  }

  // periodic autosave
  setInterval(save, 4000);
  window.addEventListener("beforeunload", save);

  // ---------- boot ----------
  state = load();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
