<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Joguinhos da Isadora</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,"Segoe UI Rounded","Segoe UI",Verdana,sans-serif;
    background:linear-gradient(160deg,#eae4ff,#cff3ff 60%,#fff1f5 100%);
    display:flex; flex-direction:column; align-items:center; padding:26px 16px 40px;
    color:#3a3358;
  }
  h1{ font-size:1.5rem; text-align:center; margin:6px 0 24px; }
  .cards{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px; }
  a.card{
    display:flex; align-items:center; gap:16px;
    background:#fff; border-radius:20px; padding:16px 18px;
    text-decoration:none; color:#3a3358;
    box-shadow:0 5px 0 rgba(58,51,88,0.12);
  }
  a.card:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(58,51,88,0.12); }
  .emoji{ font-size:2.4rem; flex:0 0 auto; }
  .txt strong{ display:block; font-size:1.05rem; }
  .txt span{ font-size:0.8rem; color:#8a7fb0; }
  footer{ margin-top:30px; font-size:0.7rem; color:#9c92bd; }
</style>
</head>
<body>
  <h1>🎮 Joguinhos da Isadora</h1>
  <div class="cards">
    <a class="card" href="estourar-baloes.html">
      <div class="emoji">🎈</div>
      <div class="txt"><strong>Estourar Balões</strong><span>Estoure os balões que sobem no céu</span></div>
    </a>
    <a class="card" href="jogo-isadora.html">
      <div class="emoji">🐣</div>
      <div class="txt"><strong>Fazendinha da Isadora</strong><span>Junte ovos e bichinhos até virar unicórnio</span></div>
    </a>
    <a class="card" href="estudio-moda-isadora.html">
      <div class="emoji">💄</div>
      <div class="txt"><strong>Estúdio de Moda</strong><span>Vista as bonecas com roupas, cabelo e maquiagem</span></div>
    </a>
  </div>
  <footer>Feito com carinho para a Isadora 💜</footer>
</body>
</html>
